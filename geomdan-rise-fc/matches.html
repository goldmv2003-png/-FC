
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="검단 라이즈FC 경기 일정 및 결과">
<title>경기일정 | GEOMDAN RISE FC</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* 경기 페이지 */
.match-page-list{
  display:grid;
  gap:20px;
  margin:30px 0;
}

.match-data-card{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:25px;
  margin-bottom:5px;
}

.match-data-card h2{
  font-size:23px;
  margin:12px 0;
}

.match-meta{
  color:#aaa;
  font-size:14px;
  line-height:2;
}

.match-badge{
  display:inline-block;
  background:#333;
  color:#c9a646;
  padding:6px 10px;
  border-radius:4px;
  font-size:11px;
}

.match-badge.finished{
  background:#234b32;
  color:#8cdb9e;
}

.formation-box{
  background:#202020;
  border:1px solid #444;
  padding:18px;
  border-radius:8px;
  margin-top:20px;
}

.formation-title{
  color:#c9a646;
  font-weight:bold;
  margin-bottom:15px;
}

.bench-list{
  color:#ccc;
  font-size:13px;
  line-height:2;
  margin-top:20px;
}

.result-score{
  font-size:35px;
  font-weight:900;
  color:#c9a646;
  margin:15px 0;
}

.result-details{
  color:#bbb;
  font-size:14px;
  line-height:1.9;
  white-space:pre-line;
  margin-top:15px;
}

.match-loading{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.match-error{
  color:#ff7777;
  padding:20px;
  line-height:1.8;
}

.match-tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.match-tabs button{
  background:#222;
  color:#fff;
  border:1px solid #444;
  cursor:pointer;
}

.match-tabs button.active{
  background:#c9a646;
  color:#000;
  border-color:#c9a646;
}

/* =================================
   세로형 축구 전술 작전판
================================= */

.pitch-title{
  color:#c9a646;
  text-align:center;
  font-weight:900;
  margin:20px 0 10px;
  letter-spacing:2px;
  font-size:14px;
}

.tactics-pitch{
  position:relative;
  width:100%;
  max-width:490px;
  min-height:560px;
  margin:20px auto;
  padding:35px 8px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:12px;
  overflow:hidden;
  border:3px solid white;
  border-radius:8px;

  background:repeating-linear-gradient(
    0deg,
    #176b3c 0px,
    #176b3c 65px,
    #1d7946 65px,
    #1d7946 130px
  );
}

/* 경기장 중앙선 */
.pitch-half-line{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  border-top:2px solid #ffffff88;
  z-index:1;
}

/* 중앙 원 */
.pitch-center-circle{
  position:absolute;
  width:110px;
  height:110px;
  border:2px solid #ffffff88;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:1;
}

/* 선수 배치 행 */
.pitch-row{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  width:100%;
  min-height:65px;
}

/* 선수 */
.pitch-player{
  display:flex;
  flex:1;
  min-width:0;
  max-width:85px;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.pitch-player-number{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#c9a646;
  color:#111;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:14px;
  box-shadow:0 3px 8px #0008;
}

.pitch-player-name{
  color:white;
  font-size:11px;
  font-weight:bold;
  margin-top:6px;
  text-shadow:0 2px 4px black;
  word-break:keep-all;
}

.pitch-position-label{
  color:#ffe29a;
  font-size:10px;
  margin-top:3px;
}

.pitch-direction{
  color:#ffffffaa;
  font-size:10px;
  text-align:center;
  letter-spacing:3px;
  margin-bottom:5px;
}

/* 작전판 하단 */
.pitch-footer{
  text-align:center;
  color:#aaa;
  font-size:11px;
  margin-top:10px;
}

@media(max-width:600px){

  .match-data-card{
    padding:17px;
  }

  .result-score{
    font-size:28px;
  }

  .tactics-pitch{
    min-height:480px;
    padding:20px 4px;
    gap:8px;
  }

  .pitch-player-number{
    width:33px;
    height:33px;
    font-size:12px;
  }

  .pitch-player-name{
    font-size:9px;
  }

  .pitch-position-label{
    font-size:9px;
  }

  .pitch-center-circle{
    width:85px;
    height:85px;
  }
}
</style>
</head>

<body>

<!-- 상단 메뉴 -->
<header class="match-page-header">

  <a href="index.html" class="logo">
    <img src="images/라이즈FC 엠블럼.png" alt="라이즈FC 엠블럼">
    RISE<span>FC</span>
  </a>

  <a href="index.html" class="match-back">
    ← 홈으로 돌아가기
  </a>

</header>

<!-- 경기 페이지 -->
<main class="match-page">

  <p class="section-label">03 / MATCH CENTER</p>

  <h1>전체 경기일정<span>.</span></h1>

  <p class="match-page-desc">
    검단 라이즈FC의 경기 일정, 확정 포메이션 및 경기 결과를 확인하세요.
  </p>

  <!-- 경기 필터 -->
  <div class="match-tabs match-page-tabs">

    <button class="active" data-filter="ALL">전체 경기</button>

    <button data-filter="UPCOMING">예정 경기</button>

    <button data-filter="RESULTS">경기 결과</button>

  </div>

  <!-- 경기 목록 -->
  <div class="match-page-list" id="all-match-list">

    <div class="match-loading">
      경기 정보를 불러오는 중입니다...
    </div>

  </div>

  <a href="index.html#matches" class="match-home-btn">
    ← 경기일정 메인으로
  </a>

</main>

<footer>

  <strong>GEOMDAN RISE FC</strong>

  <p>RISE TOGETHER. · © 2026 RISE FC</p>

</footer>

<script>

/* =================================
   SUPABASE 연결
================================= */

const SUPABASE_URL =
"https://gqsecxgzegyzzwlmfavr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8BKTlYkIEEwNS-dDauIfFg_3FSdkcDJ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const list = document.getElementById("all-match-list");

let matches = [];
let players = [];
let currentFilter = "ALL";
let playerLoadError = false;


/* =================================
   HTML 안전 처리
================================= */

function safe(value){

  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[c]);

}


/* =================================
   경기 데이터 불러오기
================================= */

async function loadPublicMatches(){

  list.innerHTML = `
    <div class="match-loading">
      경기 정보를 불러오는 중입니다...
    </div>
  `;

  try{

    // 공개 승인된 경기만 조회
    const {data,error} = await db
      .from("matches")
      .select("*")
      .eq("is_published",true)
      .order("match_date",{ascending:false});

    if(error){
      throw new Error("경기 데이터 조회 실패: " + error.message);
    }

    matches = data || [];

    // 선수 데이터 조회
    const {data:playerData,error:playerError} = await db
      .from("players")
      .select("id,number,name,position");

    if(playerError){

      console.error("선수 조회 오류:",playerError);

      playerLoadError = true;

      players = [];

    }else{

      players = playerData || [];

      playerLoadError = false;

    }

    renderMatches();

  }catch(error){

    console.error("경기 로딩 오류:",error);

    list.innerHTML = `
      <div class="match-error">
        경기 정보를 불러오지 못했습니다.<br><br>
        ${safe(error.message)}
        <br><br>
        Supabase의 matches 테이블 RLS 정책을 확인해 주세요.
      </div>
    `;

  }

}


/* =================================
   선수 정보 찾기
================================= */

function findPlayer(id){

  return players.find(
    p=>String(p.id)===String(id)
  );

}


/* =================================
   포메이션 작전판
================================= */

function renderTacticsBoard(match){

  const lineup = Array.isArray(match.lineup)
    ? match.lineup
    : [];

  if(!lineup.length){

    return `
      <p class="match-loading">
        확정된 선발 명단이 없습니다.
      </p>
    `;

  }

  // 선수 슬롯 번호 추출
  function getNumber(slot){

    const found = String(slot.slot || "").match(/\d+/);

    return found ? Number(found[0]) : 0;

  }

  // 포지션별 선수 배치
  let rows = [];

  if(match.formation === "4-2-3-1"){

    rows = [

      // 공격수
      lineup.filter(p=>p.position==="FW"),

      // 공격형 미드필더
      lineup.filter(
        p=>p.position==="MF" && getNumber(p)>=3
      ),

      // 수비형 미드필더
      lineup.filter(
        p=>p.position==="MF" && getNumber(p)<=2
      ),

      // 수비수
      lineup.filter(p=>p.position==="DF"),

      // 골키퍼
      lineup.filter(p=>p.position==="GK")

    ];

  }else{

    rows = [

      lineup.filter(p=>p.position==="FW"),

      lineup.filter(p=>p.position==="MF"),

      lineup.filter(p=>p.position==="DF"),

      lineup.filter(p=>p.position==="GK")

    ];

  }

  // 같은 라인 안에서는 슬롯 번호 순서대로 배치
  rows = rows
    .filter(row=>row.length)
    .map(row=>row.sort((a,b)=>getNumber(a)-getNumber(b)));

  return `

    <div class="pitch-title">

      STARTING XI · ${safe(match.formation || "FORMATION")}

    </div>

    <div class="pitch-direction">
      ▲ ATTACK
    </div>

    <div class="tactics-pitch">

      <div class="pitch-half-line"></div>

      <div class="pitch-center-circle"></div>

      ${rows.map(row=>`

        <div class="pitch-row">

          ${row.map(slot=>{

            const player = findPlayer(slot.player_id);

            return `

              <div class="pitch-player">

                <div class="pitch-player-number">

                  ${player ? safe(player.number) : "?"}

                </div>

                <div class="pitch-player-name">

                  ${player
                    ? safe(player.name)
                    : "선수 정보 없음"
                  }

                </div>

                <div class="pitch-position-label">

                  ${safe(slot.slot || slot.position)}

                </div>

              </div>

            `;

          }).join("")}

        </div>

      `).join("")}

    </div>

    <div class="pitch-footer">
      GEOMDAN RISE FC · OFFICIAL STARTING XI
    </div>

  `;

}


/* =================================
   경기 카드 출력
================================= */

function renderMatches(){

  let filtered = [...matches];

  // 예정 경기
  if(currentFilter==="UPCOMING"){

    filtered = filtered.filter(
      m=>m.status!=="finished"
    );

  }

  // 경기 결과
  if(currentFilter==="RESULTS"){

    filtered = filtered.filter(
      m=>m.status==="finished"
    );

  }

  // 경기 없음
  if(!filtered.length){

    list.innerHTML = `

      <div class="match-page-empty">

        <span>03</span>

        <h2>등록된 경기가 없습니다.</h2>

        <p>
          감독이 경기 일정을 승인하면 이곳에 표시됩니다.
        </p>

      </div>

    `;

    return;

  }

  list.innerHTML = filtered.map(match=>{

    const finished = match.status==="finished";

    const lineup = Array.isArray(match.lineup)
      ? match.lineup
      : [];

    const attendance = Array.isArray(match.attendance)
      ? match.attendance
      : [];

    // 세로형 작전판
    const tacticsBoard = renderTacticsBoard(match);

    // 선발 선수 ID
    const starterIds = lineup.map(
      slot=>String(slot.player_id)
    );

    // 후보 선수
    const bench = attendance
      .filter(id=>!starterIds.includes(String(id)))
      .map(id=>findPlayer(id))
      .filter(Boolean);

    const benchHTML = bench.length

      ? bench.map(p=>
          safe(p.number)+"번 "+safe(p.name)
        ).join(" / ")

      : "등록된 후보 선수가 없습니다.";

    // 득점 기록
    const scorerHTML = Array.isArray(match.scorers)

      ? match.scorers.map(s=>safe(s)).join("<br>")

      : safe(match.scorers || "");

    return `

      <article class="match-data-card">

        <div>

          <span class="match-badge ${finished?"finished":""}">

            ${finished?"경기 종료":"경기 예정"}

          </span>

        </div>

        <h2>
          GEOMDAN RISE FC vs ${safe(match.opponent)}
        </h2>

        <div class="match-meta">

          📅 ${safe(match.match_date)}
          ${safe(match.match_time || "")}

          <br>

          📍 ${safe(match.venue || "장소 미정")}

        </div>

        ${
          finished
          ? `

            <div class="result-score">

              ${safe(match.home_score)}
              :
              ${safe(match.away_score)}

            </div>

            <div class="result-details">

              <strong>득점 기록</strong>

              <br>

              ${scorerHTML || "득점 기록 없음"}

              <br><br>

              <strong>경기 기록</strong>

              <br>

              ${safe(
                match.match_notes ||
                "등록된 경기 기록이 없습니다."
              )}

            </div>

          `
          : ""
        }

        ${
          lineup.length
          ? `

            <div class="formation-box">

              <div class="formation-title">

                ⚽ CONFIRMED FORMATION ·
                ${safe(match.formation || "미정")}

              </div>

              <strong>STARTING LINEUP · 선발 명단</strong>

              ${tacticsBoard}

              <div class="bench-list">

                <strong>
                  SUBSTITUTES · 후보 선수 (${bench.length}명)
                </strong>

                <br>

                ${benchHTML}

              </div>

            </div>

          `
          : `

            <div class="formation-box">

              <div class="formation-title">
                ⚽ CONFIRMED FORMATION
              </div>

              <p>
                확정된 선발 명단이 없습니다.
              </p>

            </div>

          `
        }

        ${
          playerLoadError
          ? `
            <p class="match-error">
              선수 정보를 불러오지 못해 작전판의 선수 이름이 표시되지 않을 수 있습니다.
            </p>
          `
          : ""
        }

      </article>

    `;

  }).join("");

}


/* =================================
   경기 필터
================================= */

document.querySelectorAll("[data-filter]").forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll("[data-filter]")
      .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    currentFilter = button.dataset.filter;

    renderMatches();

  });

});


/* =================================
   실시간 경기 업데이트
================================= */

db.channel("public-match-updates")

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"matches"
    },
    ()=>{
      console.log("경기 데이터 변경 감지");

      loadPublicMatches();
    }
  )

  .subscribe(status=>{

    console.log(
      "경기 실시간 연결 상태:",
      status
    );

  });


/* =================================
   최초 실행
================================= */

loadPublicMatches();

</script>

</body>
</html>
```
